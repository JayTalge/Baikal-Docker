# Based on https://sabre.io/baikal/install/
# Behind a TLS-terminating reverse proxy (e.g. Nginx Proxy Manager) let PHP
# see https, so Baikal's own redirects/base URI use the public scheme and port.
map $http_x_forwarded_proto $baikal_https { default ""; https on; }
map $http_x_forwarded_proto $baikal_port  { default $server_port; https 443; http 80; }

server {
  listen 80 default_server;
  server_name _;

  root /var/www/baikal/html;
  index index.php;
  charset utf-8;
  client_max_body_size 50m;

  # Relative redirect, so it keeps the scheme/host of the reverse proxy
  absolute_redirect off;
  location = /.well-known/caldav  { return 301 /dav.php; }
  location = /.well-known/carddav { return 301 /dav.php; }

  location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

  location ~ /(\.ht|Core|Specific) { deny all; return 404; }

  location ~ ^(.+\.php)(.*)$ {
    try_files $fastcgi_script_name =404;
    include /etc/nginx/fastcgi_params;
    fastcgi_split_path_info ^(.+\.php)(.*)$;
    fastcgi_pass unix:/run/php-fpm.sock;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param PATH_INFO $fastcgi_path_info;
    fastcgi_param HTTPS $baikal_https if_not_empty;
    fastcgi_param SERVER_PORT $baikal_port;
    fastcgi_read_timeout 300s;
  }
}
