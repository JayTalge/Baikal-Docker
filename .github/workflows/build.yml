name: Build image from upstream release

on:
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream Baikal tag to build (empty = latest release)"
        required: false
      force:
        description: "Rebuild even if the tag already exists in GHCR"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["Dockerfile", "rootfs/**", ".github/workflows/build.yml"]

permissions:
  contents: read
  packages: write

env:
  UPSTREAM: sabre-io/Baikal
  IMAGE: ghcr.io/jaytalge/baikal

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve upstream tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG=$(gh api "repos/$UPSTREAM/releases/latest" --jq .tag_name)
          fi
          echo "$TAG" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "Unexpected tag: $TAG"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "minor=${TAG%.*}" >> "$GITHUB_OUTPUT"
          echo "Upstream tag: $TAG"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip if already built
        id: check
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          FORCE: ${{ inputs.force || github.event_name == 'push' }}
        run: |
          if [ "$FORCE" != "true" ] && docker manifest inspect "$IMAGE:$TAG" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "$TAG already built"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.skip == 'false'

      - uses: docker/setup-buildx-action@v3
        if: steps.check.outputs.skip == 'false'

      - name: Build for test
        if: steps.check.outputs.skip == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          pull: true
          build-args: BAIKAL_VERSION=${{ steps.tag.outputs.tag }}
          tags: baikal:smoke

      - name: Smoke test
        if: steps.check.outputs.skip == 'false'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          docker run -d --name smoke -p 8080:80 baikal:smoke
          for i in $(seq 1 20); do curl -fsS -o /dev/null http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fsS -o /dev/null -w "install page %{http_code}\n" http://127.0.0.1:8080/admin/install/
          docker exec smoke grep -q "\"$TAG\"" /var/www/baikal/Core/Distrib.php

      - name: Push
        if: steps.check.outputs.skip == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: BAIKAL_VERSION=${{ steps.tag.outputs.tag }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE }}:${{ steps.tag.outputs.minor }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.tag.outputs.tag }}
            org.opencontainers.image.revision=${{ steps.tag.outputs.tag }}@${{ env.UPSTREAM }}

